  <text x="1130" y="488" fill="#c9d3e6" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Beta Auto Network: Consider increasing budget.</text>
  <text x="1130" y="514" fill="#c9d3e6" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Gamma Clicks: Keep current budget for now.</text>
  <text x="1130" y="540" fill="#c9d3e6" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Alpha Motors: Monitor closely or reduce spend.</text>

  <rect x="1100" y="650" rx="12" ry="12" width="450" height="200" fill="#1a2332" stroke="#2a3545"/>
